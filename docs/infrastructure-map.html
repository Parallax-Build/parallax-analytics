<style>
/* Layout: one wide left-to-right flow diagram as the page's subject, then three ledgers (kept, never kept, infrastructure) and the commitments. */
:root {
  --bg: #F5F6F9; --surface: #FFFFFF; --zone: #ECEEF4; --fg: #161B2E; --muted: #5B6278;
  --line: #C3C8D6; --keep: #0B6B83; --drop: #B23A30;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1320; --surface: #182033; --zone: #131A2B; --fg: #E8EBF3; --muted: #9AA3BA;
  --line: #34405C; --keep: #5CC4DC; --drop: #F08A7E; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1320; --surface: #182033; --zone: #131A2B; --fg: #E8EBF3; --muted: #9AA3BA;
  --line: #34405C; --keep: #5CC4DC; --drop: #F08A7E; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; }
.head-text { min-width: 0; flex: 1 1 420px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(26px, 4vw, 38px); line-height: 1.12; margin: 0; text-wrap: balance; max-width: 22ch; }
.lede { margin: 12px 0 0; color: var(--muted); max-width: 65ch; }
.langs { display: flex; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.langs button { font: 500 13px var(--body); color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.langs button:focus-visible { outline: 2px solid var(--keep); outline-offset: 2px; }

figure { margin: 0; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.scroll svg { display: block; width: 100%; min-width: 980px; height: auto; }
figcaption { margin-top: 10px; color: var(--muted); font-size: 13.5px; max-width: 80ch; }
.key { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 8px; }
.key i { width: 22px; height: 0; border-top: 2px solid var(--fg); display: inline-block; }
.key i.k { border-color: var(--keep); } .key i.d { border-color: var(--drop); border-top-style: dashed; }

/* svg */
svg text { font-family: var(--body); fill: var(--fg); }
.zone { fill: var(--zone); stroke: var(--line); stroke-dasharray: 5 4; }
.zt { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; fill: var(--muted); }
.n rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.n.db rect { stroke: var(--keep); stroke-width: 1.8; }
.n.who rect { fill: none; stroke: var(--fg); }
.nt { font-size: 13px; font-weight: 600; }
.ns { font-size: 10.5px; fill: var(--muted); }
.e { stroke: var(--fg); stroke-width: 1.4; fill: none; }
.e.k { stroke: var(--keep); stroke-width: 2; }
.e.d { stroke: var(--drop); stroke-dasharray: 4 3; }
.ah { fill: var(--fg); } .ah.k { fill: var(--keep); }
.el { font-size: 11px; fill: var(--muted); stroke: var(--bg); stroke-width: 4; paint-order: stroke; stroke-linejoin: round; }
.el.k { fill: var(--keep); font-weight: 600; }
.dl { font-size: 11px; font-weight: 600; fill: var(--drop); }
.fn { font-size: 10.5px; fill: var(--muted); }

.ledgers { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.ledger { min-width: 0; border-top: 3px solid var(--line); padding-top: 14px; }
.ledger.k { border-color: var(--keep); } .ledger.d { border-color: var(--drop); }
h2 { font-family: var(--display); font-weight: 600; font-size: 18px; margin: 0 0 10px; }
.ledger ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; }
.path { font-family: var(--mono); font-size: 12.5px; background: var(--zone); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; white-space: nowrap; }
.path .x { color: var(--drop); text-decoration: line-through; } .path .y { color: var(--keep); font-weight: 500; }
.path-label { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 13px; }
td:last-child { font-weight: 600; }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 4px; }
footer a { color: var(--keep); }
</style>

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function diagram(t) {
  var s = [];
  function zone(x, y, w, h, k) {
    s.push('<rect class="zone" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="12"/>');
    s.push('<text class="zt" x="' + (x + 16) + '" y="' + (y + 24) + '">' + esc(t[k]) + '</text>');
  }
  function node(x, y, w, h, k, subs, cls) {
    var cx = x + w / 2, rx = cls === "who" ? h / 2 : 8;
    var total = 16 + subs.length * 14, ty = y + (h - total) / 2 + 13;
    s.push('<g class="n ' + (cls || "") + '"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + rx + '"/>');
    s.push('<text class="nt" text-anchor="middle" x="' + cx + '" y="' + ty + '">' + esc(t[k]) + '</text>');
    subs.forEach(function (sk, i) {
      s.push('<text class="ns" text-anchor="middle" x="' + cx + '" y="' + (ty + 16 + i * 14) + '">' + esc(t[sk]) + '</text>');
    });
    s.push('</g>');
  }
  function edge(pts, cls) {
    var m = cls === "k" ? "ak" : "a";
    s.push('<polyline class="e ' + (cls || "") + '" points="' + pts + '"' + (cls === "d" ? "" : ' marker-end="url(#' + m + ')"') + '/>');
  }
  function label(x, y, k, cls, anchor) {
    s.push('<text class="' + (cls || "el") + '" text-anchor="' + (anchor || "middle") + '" x="' + x + '" y="' + y + '">' + esc(t[k]) + '</text>');
  }

  s.push('<svg viewBox="0 0 1260 530" role="img" aria-label="' + esc(t.caption) + '">');
  s.push('<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>');
  s.push('<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah k" d="M0 0L10 5L0 10z"/></marker></defs>');

  zone(20, 40, 230, 470, "zTenant");
  zone(330, 40, 250, 470, "zIngest");

function list(id, items) {
  document.getElementById(id).innerHTML = items.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("");
}

function setLang(l) {
  if (!T[l]) l = "en";
  var t = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(function (el) { el.textContent = t[el.getAttribute("data-i")]; });
  document.getElementById("diagram").innerHTML = diagram(t);
  list("kept", t.kept); list("never", t.never); list("infra", t.infra);
  document.getElementById("sla").innerHTML = t.sla.map(function (r) {
    return "<tr><th scope=\"row\">" + esc(r[0]) + "</th><td>" + esc(r[1]) + "</td></tr>";
  }).join("");
  document.querySelectorAll(".langs button").forEach(function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-lang") === l ? "true" : "false");
  });
  try { localStorage.setItem("parallax-lang", l); } catch (e) {}
}

document.querySelectorAll(".langs button").forEach(function (b) {
  b.addEventListener("click", function () {
    var l = b.getAttribute("data-lang");
    setLang(l);
    try { history.replaceState(null, "", "#" + l); } catch (e) { location.hash = l; }
  });
});
window.addEventListener("hashchange", function () {
  var h = location.hash.slice(1); if (T[h]) setLang(h);
});
(function () {
  var l = location.hash.slice(1);
  if (!T[l]) { try { l = localStorage.getItem("parallax-lang"); } catch (e) { l = null; } }
  if (!T[l]) l = (navigator.language || "en").slice(0, 2).toLowerCase();
  setLang(l);
})();
</script>
