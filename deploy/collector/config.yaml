# GENERATED by scripts/gen-collector-config.ts. Do not edit by hand.
# Path rules come from packages/path-rules; run `pnpm gen:collector` after changing them.
#
# What this pipeline does:
#   traces  -> keep server spans, set the tenant from the gateway, normalize the
#              path, strip every other attribute, count requests and durations,
#              then DROP the spans. Only the derived metrics go on.
#   metrics -> dropped (deriving from a tenant's own HTTP metrics is on the roadmap).
#   logs    -> dropped.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  filter/server-spans:
    error_mode: ignore
    traces:
      span:
        - 'kind != SPAN_KIND_SERVER'
  resource/tenant:
    attributes:
      # Set by the ingest gateway from the tenant's API key. Whatever the
      # tenant sent under this name is overwritten.
      - key: parallax.tenant
        from_context: metadata.x-parallax-tenant
        action: upsert
  transform/route:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - 'set(attributes["parallax.route"], attributes["http.route"]) where attributes["http.route"] != nil'
          - 'set(attributes["parallax.route"], attributes["url.path"]) where attributes["parallax.route"] == nil and attributes["url.path"] != nil'
          - 'set(attributes["parallax.route"], attributes["http.target"]) where attributes["parallax.route"] == nil and attributes["http.target"] != nil'
          - 'set(attributes["parallax.route"], "/{unknown}") where attributes["parallax.route"] == nil'
          - 'replace_pattern(attributes["parallax.route"], "[?#].*", "")'
          - 'replace_pattern(attributes["parallax.route"], "/M[A-Z2-7]{68}\\b", "/{muxed}")'
          - 'replace_pattern(attributes["parallax.route"], "/[A-Za-z0-9]{1,12}[-:]G[A-Z2-7]{55}\\b", "/{asset}")'
          - 'replace_pattern(attributes["parallax.route"], "/G[A-Z2-7]{55}\\b", "/{account}")'
          - 'replace_pattern(attributes["parallax.route"], "/C[A-Z2-7]{55}\\b", "/{contract}")'
          - 'replace_pattern(attributes["parallax.route"], "/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\\b", "/{uuid}")'
          - 'replace_pattern(attributes["parallax.route"], "/[0-9a-fA-F]{64}\\b", "/{hash}")'
          - 'replace_pattern(attributes["parallax.route"], "/[0-9a-fA-F]{16,}\\b", "/{hex}")'
          - 'replace_pattern(attributes["parallax.route"], "/[0-9]+\\b", "/{id}")'
          - 'replace_pattern(attributes["parallax.route"], "/[^/]{65,}", "/{other}")'
          - 'set(attributes["parallax.status"], attributes["http.response.status_code"]) where attributes["http.response.status_code"] != nil'
          - 'set(attributes["parallax.status"], attributes["http.status_code"]) where attributes["parallax.status"] == nil and attributes["http.status_code"] != nil'
          - 'set(attributes["parallax.route"], "/{not-found}") where attributes["http.route"] == nil and (attributes["parallax.status"] == 404 or attributes["parallax.status"] == "404")'
          - 'set(attributes["parallax.method"], attributes["http.request.method"]) where attributes["http.request.method"] != nil'
          - 'set(attributes["parallax.method"], attributes["http.method"]) where attributes["parallax.method"] == nil and attributes["http.method"] != nil'
          - 'keep_keys(attributes, ["parallax.route", "parallax.status", "parallax.method"])'
          - 'set(name, "request")'

connectors:
  span_metrics:
    histogram:
      unit: ms
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    dimensions:
      - name: parallax.route
      - name: parallax.status
      - name: parallax.method
    exclude_dimensions: [span.name, span.kind, status.code]
    resource_metrics_key_attributes: [service.name, parallax.tenant]
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    metrics_flush_interval: 15s

exporters:
  otlp_http/writer:
    endpoint: ${env:PARALLAX_WRITER_URL}
    encoding: json
    compression: none
    headers:
      x-internal-key: ${env:PARALLAX_INTERNAL_KEY}
  nop:

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/tenant, filter/server-spans, transform/route]
      exporters: [span_metrics]
    metrics/derived:
      receivers: [span_metrics]
      exporters: [otlp_http/writer]
    metrics/dropped:
      receivers: [otlp]
      exporters: [nop]
    logs/dropped:
      receivers: [otlp]
      exporters: [nop]
